version: 2

models:
  - name: mart_tonnage_components
    description: Per-stroke tonnage components by run, as shares of the part's mean.
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: ss_stroke_to_stroke
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1000000000
  - name: mart_attribute_fails_by_interval
    description: Attribute check fails by fifth of the sharpening interval.
    columns:
      - name: interval_fifth
        tests:
          - not_null
          - in_range:
              arguments:
                min_value: 1
                max_value: 5
  - name: mart_variance_components
    description: Variance components by characteristic over the record.
    config:
      components_min_subgroups: "{{ var('components_min_subgroups') }}"
    columns:
      - name: characteristic_id
        tests: [not_null, unique]
      - name: share_within
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: share_between_subgroups_in_coil
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: share_between_coils
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: share_between_intervals
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: incoming_coil_share
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: trend_share
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: lag_1_autocorrelation_within_coil
        tests:
          - in_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_capability
    description: Capability by characteristic for the quarter and the record, with 95% intervals.
    config:
      capability_min_subgroups: "{{ var('capability_min_subgroups') }}"
      quarter_start: "{{ var('quarter_start') }}"
    tests:
      - unique_combination:
          arguments:
            columns: [period, characteristic_id]
    columns:
      - name: subgroups
        tests:
          - in_range:
              arguments:
                min_value: 60
      - name: ppk
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: cpk
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: period
        tests:
          - accepted_values:
              arguments:
                values: ['quarter', 'record']
      - name: cpk_definition
        tests:
          - accepted_values:
              arguments:
                values: ['between/within', 'residual about the wear regression', 'pooled within-subgroup']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_coil_change_points
    description: Coil-change subgroups on formed characteristics with the coil certificate, and the points of the chart of coil-change means.
    columns:
      - name: subgroup_id
        tests: [not_null, unique]
      - name: coils_on_record
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_coil_fit
    description: Formed coil-change means against the coil certificate, by characteristic.
    columns:
      - name: characteristic_id
        tests: [not_null, unique]
      - name: r_squared
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: residual_sigma_share_of_tolerance
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_limit_sets
    description: Every limit set with its basis, trigger and verifications.
    columns:
      - name: limit_set_id
        tests: [not_null, unique]
      - name: subgroups_used
        tests:
          - in_range:
              arguments:
                min_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_limit_recalculations
    description: New limit sets issued in the record by month, trigger and chart.
    tests:
      - unique_combination:
          arguments:
            columns: [issued_month, trigger, chart]
    columns:
      - name: limit_sets
        tests:
          - in_range:
              arguments:
                min_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_limit_verifications
    description: Verifications of limits held across a die event.
    columns:
      - name: verification_id
        tests: [not_null, unique]
      - name: subgroups
        tests:
          - in_range:
              arguments:
                min_value: 25
      - name: result
        tests:
          - accepted_values:
              arguments:
                values: ['passed', 'failed']
      - name: die_event
        tests:
          - accepted_values:
              arguments:
                values: ['sharpening', 'rebuild', 'forming-station repair', 'repair']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_phase1_baseline_subgroups
    description: The subgroups of each Phase I baseline completed in the record.
    tests:
      - unique_combination:
          arguments:
            columns: [limit_set_id, subgroup_id]
    columns:
      - name: baseline_subgroup_no
        tests:
          - in_range:
              arguments:
                min_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_phase1_baselines
    description: Phase I baselines with screening and normality.
    columns:
      - name: limit_set_id
        tests: [not_null, unique]
      - name: anderson_darling
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_charts_in_force
    description: The charts in force at the status date.
    columns:
      - name: characteristic_id
        tests: [not_null, unique]
      - name: pct_grr_of_tolerance
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_signals
    description: Every alarm in the record with its disposition.
    columns:
      - name: alarm_id
        tests: [not_null, unique]
      - name: minutes_to_close
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: rule_group
        tests:
          - accepted_values:
              arguments:
                values: ['rule 1', 'rules 2 to 4']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_signal_rates
    description: Observed signals on routine subgroups in scope, by characteristic, period, chart and baseline size.
    tests:
      - unique_combination:
          arguments:
            columns: [period, characteristic_id, press_id, chart, baseline_subgroups]
    columns:
      - name: subgroups_in_scope
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: period
        tests:
          - accepted_values:
              arguments:
                values: ['quarter', 'record']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_gauge_quarter_end
    description: Calibration status of every gauge at each quarter end.
    tests:
      - unique_combination:
          arguments:
            columns: [quarter_end, gauge_id]
    columns:
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_gauge_studies
    description: Gauge studies on file.
    columns:
      - name: study_id
        tests: [not_null, unique]
      - name: pct_grr_of_tolerance
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: grr_band
        tests:
          - accepted_values:
              arguments:
                values: ['under 10%', '10% to 30%', 'over 30%']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_fixture_verifications
    description: Daily master-part verifications of the check fixtures.
    columns:
      - name: verification_id
        tests: [not_null, unique]
      - name: share_of_tolerance
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_operator_kappa
    description: Burr check qualifications by operator.
    columns:
      - name: qualification_id
        tests: [not_null, unique]
      - name: kappa
        tests:
          - in_range:
              arguments:
                min_value: -1
                max_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_measurement_subgroups
    description: Subgroups on a gauge away or past due, by press and month.
    tests:
      - unique_combination:
          arguments:
            columns: [press_id, sample_month]
    columns:
      - name: subgroups
        tests:
          - in_range:
              arguments:
                min_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_wear_points
    description: Hole diameter and burr height subgroups against shots since sharpening.
    columns:
      - name: subgroup_id
        tests: [not_null, unique]
      - name: shots_since_sharpening
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_wear_slopes
    description: Hole diameter wear by interval and by characteristic, with the interval count.
    tests:
      - unique_combination:
          arguments:
            columns: [characteristic_id, sharpening_interval_no]
    columns:
      - name: subgroups
        tests:
          - in_range:
              arguments:
                min_value: 15
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_sharpenings
    description: Sharpenings in the record against the due count.
    tests:
      - unique_combination:
          arguments:
            columns: [die_id, sharpening_interval_no]
    columns:
      - name: share_of_due_count
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_per_stroke_run_tonnage
    description: Per-stroke tonnage by run.
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: production_strokes
        tests:
          - in_range:
              arguments:
                min_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_per_stroke_stops
    description: Stops by the per-stroke charts.
    columns:
      - name: fault_event_id
        tests: [not_null, unique]
      - name: minutes_stopped
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: finding_class
        tests:
          - accepted_values:
              arguments:
                values: ['nothing found', 'chipped punch', 'worn punch', 'slug pulling']
      - name: chart
        tests:
          - accepted_values:
              arguments:
                values: ['EWMA on the total', 'channel share', 'both']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_per_stroke_stop_strokes
    description: The strokes before each per-stroke stop.
    tests:
      - unique_combination:
          arguments:
            columns: [fault_event_id, stroke_no]
    columns:
      - name: strokes_before_the_stop
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_per_stroke_stop_rates
    description: Per-stroke stops against strokes made, by press and period.
    tests:
      - unique_combination:
          arguments:
            columns: [period, press_id]
    columns:
      - name: strokes
        tests:
          - in_range:
              arguments:
                min_value: 1
      - name: period
        tests:
          - accepted_values:
              arguments:
                values: ['quarter', 'record']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_screen_run_strokes
    description: The production strokes of the run on the PR-03 screens, to the screen time.
    columns:
      - name: stroke_no
        tests: [not_null, unique]
      - name: total_kn
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_punch_replacements
    description: Punch replacements with what led to them.
    columns:
      - name: die_event_id
        tests: [not_null, unique]
      - name: punch_condition
        tests:
          - accepted_values:
              arguments:
                values: ['chipped', 'worn']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_parts_exposed
    description: Parts exposed per chipped punch, per-stroke charts against an hourly check.
    columns:
      - name: fault_event_id
        tests: [not_null, unique]
      - name: strokes_exposed_per_stroke_charts
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_first_piece_approvals
    description: First-piece approvals at run start.
    columns:
      - name: approval_id
        tests: [not_null, unique]
      - name: minutes_to_release
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: result
        tests:
          - accepted_values:
              arguments:
                values: ['pass', 'fail']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_nonconformances
    description: Nonconformances with run, press, die and corrective action.
    columns:
      - name: ncr_id
        tests: [not_null, unique]
      - name: days_to_close
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_recording_planned_checks
    description: Planned routine checks by run and whether one was recorded.
    tests:
      - unique_combination:
          arguments:
            columns: [run_id, planned_time]
    columns:
      - name: shift
        tests:
          - accepted_values:
              arguments:
                values: ['days', 'nights']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_recording_routine_subgroups
    description: Routine subgroups with the time from the parts to the entry.
    columns:
      - name: subgroup_id
        tests: [not_null, unique]
      - name: minutes_to_entry
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: shift
        tests:
          - accepted_values:
              arguments:
                values: ['days', 'nights']
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_chart_design
    description: The chart design parameters the program runs on.
    columns:
      - name: parameter
        tests: [not_null, unique]
      - name: value
        tests: [not_null]
      - name: export_batch_id
        tests: [is_export_batch]
  - name: mart_chart_changes
    description: The chart changes made in the record, with the evidence behind each.
    columns:
      - name: characteristic_id
        tests: [not_null, unique]
      - name: evidence_value
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: export_batch_id
        tests: [is_export_batch]
