name: spc_program
version: "1.0.0"
profile: spc_program
model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: target
clean-targets: ["target", "dbt_packages"]

models:
  spc_program:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  spc_program:
    +schema: reference
    chart_design:
      +column_types:
        parameter: varchar
        value: double
        unit: varchar
        description: varchar

vars:
  raw_dir: "../../data/raw"              # the exported files, relative to this project
  record_start: "2025-07-01"             # the record: 1 July 2025 to 30 June 2026
  record_end: "2026-06-30"
  quarter_start: "2026-04-01"            # the review quarter: April to June 2026
  status_date: "2026-06-30"              # charts in force, gauges and baselines in progress are stated as at the end of this day
  annual_review_date: "2026-01-19"       # the annual review of control limits
  family_parts: ["P-11333", "P-15731", "P-14026"]   # the C110 copper family on PR-03, reported by characteristic
  baseline_subgroups: 25                 # a Phase I baseline: 25 subgroups
  three_way_baseline_coil_changes: 10    # spanning at least ten coil changes on a three-way chart
  verification_subgroups: 25             # limits held across a die event are verified on the next 25 routine subgroups
  capability_min_subgroups: 60           # a characteristic is reported for capability with at least this many routine subgroups in the period
  components_min_subgroups: 60           # and for variance components with at least this many routine subgroups in the record
  run_interval_min_shots: 20000          # a logged sharpening interval under this many shots is not a run interval
  wear_interval_min_subgroups: 15        # a sharpening interval carries a wear slope with at least this many hole diameter subgroups
  tonnage_baseline_strokes: 500          # the per-stroke charts are set on the first 500 production strokes of a run
  stop_lookback_strokes: 300             # strokes kept before each per-stroke stop
  short_run_minutes: 120                 # a run shorter than this from production start to end is a short run
  working_day_start_minute: 360          # 06:00; the presses run two shifts, 06:00 to 23:00
  working_day_end_minute: 1380           # 23:00
  shift_change_minute: 870               # 14:30
  planned_check_after_start_minutes: 20  # the first planned check on a run is at least this long after production started
  planned_check_before_end_minutes: 2
  planned_check_early_minutes: 6         # a routine check from this long before a planned time
  planned_check_late_minutes: 12         # to this long after it is the planned check, recorded
  late_entry_minutes: 20                 # an entry more than this long after the parts is a late entry
  screen_run: "R26-00820"                # the run on the PR-03 screens
  screen_as_at: "2026-05-13 12:04:00"
