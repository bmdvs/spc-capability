[project]
name = "mfg-spc-program"
version = "1.0.0"
description = "Statistical process control assessment, redesign and results for a progressive-die metal stamper"
requires-python = ">=3.12"
dependencies = [
    "dlt[duckdb]>=1.0",
    "dbt-duckdb>=1.8",
    "duckdb>=1.0",
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "playwright>=1.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*", "analytics*"]
