version: 2

models:
  - name: stg_calibration__attribute_qualifications
    description: The calibration system export of burr check qualifications, typed.
    columns:
      - name: qualification_id
        tests: [not_null, unique]
      - name: operator_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_erp__employees')
                field: employee_id
      - name: export_batch_id
        tests: [not_null]
