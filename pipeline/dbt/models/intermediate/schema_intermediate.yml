version: 2

models:
  - name: int_die_event_timeline
    description: The die maintenance log in order, with each event's sharpening interval and the shot count used.
    columns:
      - name: die_event_id
        tests: [not_null, unique]
      - name: die_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_erp__dies')
                field: die_id
      - name: sharpening_interval_no
        tests:
          - not_null
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [not_null]

  - name: int_sharpening_intervals
    description: Sharpening intervals by die, from one sharpening or rebuild to the next.
    tests:
      - unique_combination:
          arguments:
            columns: [die_id, sharpening_interval_no]
    columns:
      - name: die_id
        tests: [not_null]
      - name: interval_start
        tests: [not_null]
      - name: export_batch_id
        tests: [not_null]

  - name: int_run_shots
    description: Production runs with the die's sharpening interval and shots since sharpening at the run start.
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: press_id
        tests: [not_null]
      - name: shots_since_sharpening_at_start
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [not_null]

  - name: int_coil_assignment
    description: The coil in force at each subgroup, recorded or recovered.
    columns:
      - name: subgroup_id
        tests: [not_null, unique]
      - name: coil_assignment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['recorded', 'recovered: one coil on the run', 'recovered: same coil scanned before and after', 'unassigned']
      - name: export_batch_id
        tests: [not_null]

  - name: int_gauge_status
    description: Periods a gauge was past its calibration due date or out of service for calibration.
    columns:
      - name: calibration_id
        tests: [not_null, unique]
      - name: gauge_id
        tests: [not_null]
      - name: export_batch_id
        tests: [not_null]

  - name: int_characteristic_history
    description: Every subgroup with its run, press, die, interval, characteristic class, coil, limit set and gauge status.
    columns:
      - name: subgroup_id
        tests: [not_null, unique]
      - name: characteristic_id
        tests: [not_null]
      - name: press_id
        tests: [not_null]
      - name: characteristic_class
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['formed', 'hole diameter', 'hole position', 'length and width', 'flatness', 'burr height', 'attribute']
      - name: subgroup_type
        tests:
          - accepted_values:
              arguments:
                values: ['routine', 'coil-change', 'first-piece', 'last-piece']
      - name: limit_set_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_spc__control_limits')
                field: limit_set_id
      - name: minutes_to_entry
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: shots_since_sharpening
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [not_null]

  - name: int_run_checks
    description: The check times on each run and what was checked then.
    tests:
      - unique_combination:
          arguments:
            columns: [run_id, check_time]
    columns:
      - name: run_id
        tests: [not_null]
      - name: export_batch_id
        tests: [not_null]

  - name: int_stroke_run_alignment
    description: The press monitor clock against the SPC terminal clock by run.
    columns:
      - name: run_id
        tests: [not_null, unique]
      - name: export_batch_id
        tests: [not_null]

  - name: int_press_stroke_rate
    description: Strokes made against run speed over working clock time, by press.
    columns:
      - name: press_id
        tests: [not_null, unique]
      - name: realised_share_of_run_speed
        tests:
          - in_range:
              arguments:
                min_value: 0
                max_value: 1.05
      - name: export_batch_id
        tests: [not_null]

  - name: int_limit_sets
    description: Every limit set with its basis, trigger, verifications and the subgroups charted under it.
    columns:
      - name: limit_set_id
        tests: [not_null, unique]
      - name: characteristic_id
        tests: [not_null]
      - name: trigger
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['baseline before the record', 'failed verification', 'rebuild', 'repair', 'tool-wear re-fit', 'annual review', 'chart change']
      - name: chart
        tests:
          - accepted_values:
              arguments:
                values: ['three-way', 'tool-wear', 'X-bar and R']
      - name: export_batch_id
        tests: [not_null]

  - name: int_alarm_dispositions
    description: Every alarm with its subgroup, disposition and times to acknowledge and close.
    columns:
      - name: alarm_id
        tests: [not_null, unique]
      - name: disposition
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['assignable cause found', 'no cause found']
      - name: minutes_to_acknowledge
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: minutes_to_close
        tests:
          - in_range:
              arguments:
                min_value: 0
      - name: export_batch_id
        tests: [not_null]
